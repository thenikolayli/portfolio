version: "3.8"

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portfolio-router.rule=Host('nikolayli.com')"
        - "traefik.http.routers.portfolio-router.entrypoints=web"
        - "traefik.http.services.portfolio-service.loadbalancer.server.port=80"
        - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true
